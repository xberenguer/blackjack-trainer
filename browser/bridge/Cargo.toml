[package]
name = "stardust-browser"
version = "0.12.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
stardust-blackjack = { path = "../.." }

stardust-browser-journal = { path = "../journal" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
